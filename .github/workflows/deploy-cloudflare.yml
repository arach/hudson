name: Deploy Site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      web: ${{ steps.classify.outputs.web }}
      cloud: ${{ steps.classify.outputs.cloud }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Classify changed surfaces
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "workflows=true"
              echo "web=true"
              echo "cloud=true"
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/classify-changes.mjs \
              --base "${{ github.event.workflow_run.head_sha }}^" \
              --head "${{ github.event.workflow_run.head_sha }}"
          fi

  deploy:
    name: Deploy HudsonKit site and embed worker
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.cloud == 'true')) }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'apps/web/embed-worker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install embed worker dependencies
        run: bun install --cwd apps/web/embed-worker --frozen-lockfile

      - name: Build static site
        run: bun run build:site

      - name: Snapshot embed chunks
        run: bun run embed:snapshot

      - name: Deploy HudsonKit site worker
        working-directory: apps/web
        run: bunx wrangler deploy

      - name: Deploy embed worker
        run: bun run --cwd apps/web/embed-worker deploy
