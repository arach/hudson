name: Publish npm packages

# Automatic Actions are paused while the account billing gate is unresolved.
# Restore the push trigger after 2026-08-01; manual publishing stays available.
on:
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check publish eligibility
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ] || [ "${ENABLE_NPM_PUBLISH:-}" != "true" ]; then
            echo "npm publish disabled — set NPM_TOKEN and ENABLE_NPM_PUBLISH=true"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build

      - name: Validate HudsonKit packed package
        run: bun run validate:hudsonkit-package

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          published_any=false

          publish_if_new() {
            local dir="$1"
            local pkg="$2"
            local local_ver published_ver
            local_ver="$(node -p "require('${dir}/package.json').version")"
            published_ver="$(npm view "$pkg" version 2>/dev/null || true)"
            if [ "$local_ver" = "$published_ver" ]; then
              echo "SKIP $pkg@$local_ver already on npm"
              return 0
            fi
            echo "PUBLISH $pkg@$local_ver (npm has ${published_ver:-none})"
            npm publish --prefix "$dir"
            published_any=true
          }

          publish_if_new packages/web/hudsonkit hudsonkit
          publish_if_new packages/web/ai-backends @hudsonkit/ai

          if [ "$published_any" != true ]; then
            echo "No packages published — bump package.json versions before running this workflow"
            exit 1
          fi
