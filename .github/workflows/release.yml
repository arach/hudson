name: Publish npm packages

on:
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check publish eligibility
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ] || [ "${ENABLE_NPM_PUBLISH:-}" != "true" ]; then
            echo "npm publish disabled — set NPM_TOKEN and ENABLE_NPM_PUBLISH=true"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build

      - name: Validate HudsonKit packed package
        run: bun run validate:hudsonkit-package

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          (cd packages/web/hudsonkit && npm publish)
          (cd packages/web/ai-backends && npm publish)