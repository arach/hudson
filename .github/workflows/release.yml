name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build

      - name: Validate HudsonKit packed package
        run: bun run validate:hudsonkit-package

      - name: Detect npm publish eligibility
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ] && [ "${ENABLE_NPM_PUBLISH:-}" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN present and ENABLE_NPM_PUBLISH=true; changesets may publish packages after versioning."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "npm publish disabled (requires both the NPM_TOKEN secret and the ENABLE_NPM_PUBLISH=true repository variable); changesets will only maintain the version PR."
          fi

      - name: Version packages (npm publish disabled)
        if: steps.npm-token.outputs.present != 'true'
        uses: changesets/action@v1
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and publish packages
        if: steps.npm-token.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
