name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      kind: ${{ steps.parse.outputs.kind }}
    steps:
      - name: Parse semver
        id: parse
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not strict semver (vX.Y.Z)"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          if [ "$patch" -ne 0 ]; then
            kind=patch
          elif [ "$minor" -ne 0 ]; then
            kind=minor
          else
            kind=major
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Tag $tag → version=$version kind=$kind"

  build:
    name: Build (always)
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build:js

      - name: Site build
        run: bun run build

  full-ci:
    name: Full CI (minor / major)
    needs: classify
    if: needs.classify.outputs.kind != 'patch'
    uses: ./.github/workflows/ci.yml
