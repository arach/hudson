name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build:js

      - name: Typecheck (root)
        run: bunx tsc --noEmit

      - name: HudsonKit tests
        run: bunx vitest run packages/web/hudsonkit/__tests__

      - name: Worker typecheck
        run: bun run --cwd packages/cloud/hudson-relay-worker typecheck

      - name: Worker tests
        run: bun run --cwd packages/cloud/hudson-relay-worker test

  apple:
    name: Apple
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift build
        working-directory: packages/native/apple/HudsonKit
        run: swift build

      - name: Swift test
        working-directory: packages/native/apple/HudsonKit
        run: swift test
