name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      web: ${{ steps.classify.outputs.web }}
      native: ${{ steps.classify.outputs.native }}
      cloud: ${{ steps.classify.outputs.cloud }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed surfaces
        id: classify
        run: node scripts/ci/classify-changes.mjs

  web:
    name: Web
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.cloud == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build:js

      - name: Typecheck (root)
        run: bunx tsc --noEmit

      - name: Tests
        run: bun run test

      - name: Worker typecheck
        run: bun run --cwd packages/cloud/hudson-relay-worker typecheck

      - name: Worker tests
        run: bun run --cwd packages/cloud/hudson-relay-worker test

  apple:
    name: Apple
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The Apple package is now a single manifest at the repo root. Voice/terminal
      # backends are local-path deps to sibling repos the runner doesn't check out,
      # so keep them gated off here (HudsonVoice defaults on for consumers).
      - name: Swift build
        env:
          HUDSONKIT_WITH_VOICE: "0"
        run: swift build

      - name: Swift test
        env:
          HUDSONKIT_WITH_VOICE: "0"
        run: swift test
