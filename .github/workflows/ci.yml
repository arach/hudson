name: CI

on:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      web: ${{ steps.classify.outputs.web }}
      native: ${{ steps.classify.outputs.native }}
      cloud: ${{ steps.classify.outputs.cloud }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed surfaces
        id: classify
        run: node scripts/ci/classify-changes.mjs

  web:
    name: Web
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.cloud == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'apps/web/embed-worker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # hudson-relay-worker is intentionally outside the root workspaces (it is a
      # deployable template); install its deps explicitly, mirroring how the
      # deploy workflow installs for embed-worker.
      - name: Install worker dependencies
        run: bun install --cwd packages/cloud/hudson-relay-worker

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build:js

      - name: HudsonKit CSS bundle
        run: bun run --cwd packages/web/hudsonkit build:css

      - name: Validate HudsonKit packed package
        run: bun run validate:hudsonkit-package

      - name: Typecheck (app)
        run: bunx tsc --noEmit -p apps/web/tsconfig.json

      - name: Typecheck (app + hudsonkit tests)
        run: bunx tsc --noEmit -p apps/web/tsconfig.tests.json

      - name: Typecheck (relay src + tests)
        run: bunx tsc --noEmit -p packages/services/hudson-relay/tsconfig.json

      - name: Typecheck (scripts)
        run: bunx tsc --noEmit -p scripts/tsconfig.json

      # Lint gate: eslint exits non-zero on errors but not on warnings, so this
      # enforces zero-errors while tolerating the existing warning backlog.
      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Worker typecheck
        run: bun run --cwd packages/cloud/hudson-relay-worker typecheck

      - name: Worker tests
        run: bun run --cwd packages/cloud/hudson-relay-worker test

  apple:
    name: Apple
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The Apple package is a single manifest at the repo root. The voice
      # backend (vox) stays gated off here; the terminal backend (Termini) is
      # public, so a second leg below builds and tests with it enabled.
      # (HudsonVoice defaults on for consumers.)
      - name: Swift build
        env:
          HUDSONKIT_WITH_VOICE: "0"
        run: swift build

      - name: Swift test
        env:
          HUDSONKIT_WITH_VOICE: "0"
        run: swift test

      # Terminal-enabled leg: compiles HudsonTerminal/HudsonCanvasSurface/
      # HudsonCanvas and runs HudsonCanvasTests. Runs in the same job so the
      # shared targets' build products are reused instead of paying for a
      # second macOS runner. HUDSON_TERMINI_GIT_URL pins the public HTTPS
      # remote so CI never needs SSH credentials.
      - name: Swift build (terminal)
        env:
          HUDSONKIT_WITH_VOICE: "0"
          HUDSONKIT_WITH_TERMINAL: "1"
          HUDSON_TERMINI_GIT_URL: https://github.com/arach/Termini.git
        run: swift build

      - name: Swift test (terminal)
        env:
          HUDSONKIT_WITH_VOICE: "0"
          HUDSONKIT_WITH_TERMINAL: "1"
          HUDSON_TERMINI_GIT_URL: https://github.com/arach/Termini.git
        run: swift test --filter HudsonCanvasTests
