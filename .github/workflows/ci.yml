name: CI

# Manual only, so Actions spend stays deliberate: the Apple job bills macOS
# minutes on this private repo. Run CI from the Actions tab when a change needs
# it; release.yml requires a successful main run of the commit it publishes.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      web: ${{ steps.classify.outputs.web }}
      native: ${{ steps.classify.outputs.native }}
      cloud: ${{ steps.classify.outputs.cloud }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed surfaces
        id: classify
        run: node scripts/ci/classify-changes.mjs

  web:
    name: Web
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.cloud == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'apps/web/embed-worker/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # hudson-relay-worker is intentionally outside the root workspaces (it is a
      # deployable template); install its deps explicitly, mirroring how the
      # deploy workflow installs for embed-worker.
      - name: Install worker dependencies
        run: bun install --cwd packages/cloud/hudson-relay-worker

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: Admin build
        run: bun run --filter @hudsonkit/admin build

      - name: Admin typecheck
        run: bun run --cwd packages/web/admin typecheck

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build:js

      - name: HudsonKit CSS bundle
        run: bun run --cwd packages/web/hudsonkit build:css

      - name: Validate HudsonKit packed package
        run: bun run validate:hudsonkit-package

      - name: Typecheck (app)
        run: bunx tsc --noEmit -p apps/web/tsconfig.json

      - name: Typecheck (app + hudsonkit tests)
        run: bunx tsc --noEmit -p apps/web/tsconfig.tests.json

      - name: Typecheck (relay src + tests)
        run: bunx tsc --noEmit -p packages/services/hudson-relay/tsconfig.json

      - name: Typecheck (scripts)
        run: bunx tsc --noEmit -p scripts/tsconfig.json

      # Lint gate: eslint exits non-zero on errors but not on warnings, so this
      # enforces zero-errors while tolerating the existing warning backlog.
      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Worker typecheck
        run: bun run --cwd packages/cloud/hudson-relay-worker typecheck

      - name: Worker tests
        run: bun run --cwd packages/cloud/hudson-relay-worker test

  apple:
    name: Apple
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    env:
      # HudsonVoice consumes the provider-aware Vox Apple playback product.
      # Pin it so a restored branch-based SwiftPM cache cannot select a
      # pre-VoxAppleSpeech main revision.
      HUDSON_VOX_GIT_REVISION: 0989a058e04da9a5b012d38a577c772d13906745
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test experimental-boundary checker
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest scripts/apple/tests/test_check_experimental_boundary.py

      - name: Validate experimental HudsonKit boundary
        run: python3 scripts/apple/check-experimental-boundary.py

      - name: Validate experimental HudsonKit boundary (terminal)
        env:
          HUDSONKIT_WITH_TERMINAL: "1"
          HUDSON_TERMINI_GIT_URL: https://github.com/arach/Termini.git
          HUDSON_TERMINI_GIT_REVISION: 1509fdc6d8093b2e41064fbb273c56e630491afa
        run: python3 scripts/apple/check-experimental-boundary.py

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # HudsonVoice is part of the default package graph. Building and testing
      # it resolves/compiles Vox source but never calls runtime model preload,
      # so CI does not download Parakeet model data. Terminal remains optional.
      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      - name: Experimental synthetic demo
        run: swift run HudsonKitExperimentalDemo

      - name: Experimental visual demo builds
        run: swift build --product HudsonKitExperimentalVisualDemo

      # Terminal-enabled leg: compiles HudsonTerminal/HudsonCanvasSurface/
      # HudsonCanvas and runs HudsonCanvasTests. Runs in the same job so the
      # shared targets' build products are reused instead of paying for a
      # second macOS runner. Pin the public HTTPS remote and the known-compatible
      # revision so a restored SwiftPM branch cache cannot silently build an
      # older Termini API.
      - name: Swift build (terminal)
        env:
          HUDSONKIT_WITH_TERMINAL: "1"
          HUDSON_TERMINI_GIT_URL: https://github.com/arach/Termini.git
          HUDSON_TERMINI_GIT_REVISION: 1509fdc6d8093b2e41064fbb273c56e630491afa
        run: swift build

      - name: Swift test (terminal)
        env:
          HUDSONKIT_WITH_TERMINAL: "1"
          HUDSON_TERMINI_GIT_URL: https://github.com/arach/Termini.git
          HUDSON_TERMINI_GIT_REVISION: 1509fdc6d8093b2e41064fbb273c56e630491afa
        run: swift test --filter 'Hudson(Canvas|Terminal)Tests'
