name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'app/**'
      - 'bun.lock'
      - 'cloudflare-static-worker.ts'
      - 'docs/**'
      - 'docs.json'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'embed-worker/**'
      - 'eslint.config.mjs'
      - 'lib/**'
      - 'marketing/**'
      - 'next.config.ts'
      - 'package.json'
      - 'packages/**'
      - 'postcss.config.mjs'
      - 'public/**'
      - 'scripts/**'
      - 'site/**'
      - 'specs/**'
      - 'tsconfig.json'
      - 'types/**'
      - 'vitest.config.ts'
      - 'wrangler.jsonc'
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: AI backends build
        run: bun run --filter @hudsonkit/ai build

      - name: HudsonKit build
        run: bun run --cwd packages/web/hudsonkit build:js

      - name: Typecheck (root)
        run: bunx tsc --noEmit

      - name: HudsonKit tests
        run: bunx vitest run packages/web/hudsonkit/__tests__

      - name: Worker typecheck
        run: bun run --cwd packages/cloud/hudson-relay-worker typecheck

      - name: Worker tests
        run: bun run --cwd packages/cloud/hudson-relay-worker test

  apple:
    name: Apple
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift build
        working-directory: packages/native/apple/HudsonKit
        run: swift build

      - name: Swift test
        working-directory: packages/native/apple/HudsonKit
        run: swift test
