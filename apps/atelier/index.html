<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>hudson · atelier</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0a0a'/><circle cx='16' cy='16' r='6' fill='%2322d3ee'/></svg>"
    />
    <meta
      name="description"
      content="Standalone Atelier — HudsonKit's AppShell and WorkspaceShell mounted by a plain Vite app."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- No-FOUC theme bootstrap. Sets data-hudson-theme + data-hudson-template
         on <html> from localStorage before any CSS evaluates, so hudsonkit's
         token CSS (gated on those attributes) resolves on first paint. Mirrors
         packages/web/hudsonkit/src/theme/script.ts; keep in sync. -->
    <script>
      !(function (k, t, p) {
        try {
          var d = document.documentElement,
            q = new URLSearchParams(location.search),
            s = JSON.parse(localStorage.getItem(k) || "{}"),
            x = q.get("theme") || s.theme || t,
            y = q.get("template") || s.template || p,
            m =
              "system" === x &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "system" === x
                  ? "light"
                  : x;
          d.dataset.hudsonTheme = m;
          d.dataset.hudsonTemplate = y;
        } catch (e) {
          var d = document.documentElement,
            m =
              "system" === t &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "system" === t
                  ? "light"
                  : t;
          d.dataset.hudsonTheme = m;
          d.dataset.hudsonTemplate = p;
        }
      })("hudson.theme", "dark", "hudson");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
