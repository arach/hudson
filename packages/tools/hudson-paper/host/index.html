<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper</title>
    <meta name="description" content="Hudson Paper — journey map on HudsonKit canvas" />
    <!-- No-FOUC theme bootstrap (Atelier/Hudson convention). Default dark. -->
    <script>
      !(function (k, t, p) {
        try {
          var d = document.documentElement,
            s = JSON.parse(localStorage.getItem(k) || "{}"),
            x = s.theme || t,
            y = s.template || p,
            m =
              "system" === x &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "system" === x
                  ? "light"
                  : x;
          d.dataset.hudsonTheme = m;
          d.dataset.hudsonTemplate = y;
        } catch (e) {
          document.documentElement.dataset.hudsonTheme = "dark";
          document.documentElement.dataset.hudsonTemplate = "hudson";
        }
      })("hudson.theme", "dark", "hudson");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
