<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hudson Code Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f12;
      --chrome: #0d1114;
      --line: rgba(255,255,255,.075);
      --text: rgba(241,245,249,.88);
      --muted: rgba(148,163,184,.68);
      --dim: rgba(100,116,139,.64);
      --tint: #5eead4;
      --warn: #fbbf24;
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    #root {
      display: flex;
      min-height: 0;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--chrome) 94%, transparent);
      user-select: none;
    }
    #root.embedded header {
      display: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 20px;
      padding: 0 8px;
      border: 1px solid color-mix(in srgb, var(--tint) 42%, transparent);
      border-radius: 5px;
      color: var(--tint);
      background: color-mix(in srgb, var(--tint) 12%, transparent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .badge::before {
      width: 5px;
      height: 5px;
      content: "";
      border-radius: 999px;
      background: var(--tint);
    }
    #title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
    }
    #status {
      color: var(--dim);
      font-size: 10px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    #status.dirty { color: var(--warn); }
    #editor {
      min-height: 0;
      min-width: 0;
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #editor .cm-editor {
      flex: 1;
      min-height: 0;
      min-width: 0;
    }
  </style>
</head>
<body>
  <div id="root">
    <header>
      <span id="badge" class="badge">CODE</span>
      <span id="title">Waiting for document</span>
      <span id="status">Ready</span>
    </header>
    <main id="editor"></main>
  </div>
  <script src="./editor.js"></script>
</body>
</html>
