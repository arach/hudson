name: HudsonKitDemoIOS
options:
  bundleIdPrefix: com.hudsonkit
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

packages:
  HudsonKit:
    path: ../..

targets:
  HudsonKitDemoIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.hudsonkit.demoios
            CFBundleURLSchemes:
              - hudson
              - hudsonkit
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSMicrophoneUsageDescription: "Demo for HudPermissionGate microphone request."
        NSSpeechRecognitionUsageDescription: "Demo for HudPermissionGate speech-recognition request."
        NSCameraUsageDescription: "Demo for HudPermissionGate camera request."
        NSPhotoLibraryUsageDescription: "Demo for HudPermissionGate photos request."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: HudLint (drift guard)
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/hudlint.stamp
        script: |
          set -euo pipefail
          KIT_ROOT="${SRCROOT}/../.."
          TOOL_DIR="${KIT_ROOT}/Tools/HudLint"
          BIN="${TOOL_DIR}/.build/release/hudlint"
          # Build the linter once per machine; cached afterwards.
          if [ ! -x "${BIN}" ]; then
            (cd "${TOOL_DIR}" && /usr/bin/env xcrun swift build -c release --product hudlint)
          fi
          # Lint kit Sources + this demo's Sources. Xcode-parseable output.
          "${BIN}" --root "${KIT_ROOT}/Sources" --root "${SRCROOT}/Sources" --format xcode
          /usr/bin/touch "${DERIVED_FILE_DIR}/hudlint.stamp"
    dependencies:
      - package: HudsonKit
        product: HudsonObservability
      - package: HudsonKit
        product: HudsonUI
      - package: HudsonKit
        product: HudsonUIPermissions
      - package: HudsonKit
        product: HudsonUIAudio
      - package: HudsonKit
        product: HudsonUICapture
      - package: HudsonKit
        product: HudsonUIWeb
      - package: HudsonKit
        product: HudsonUIKeyboard
      - package: HudsonKit
        product: HudsonUIOnboarding
      - package: HudsonKit
        product: HudsonBridge
      - package: HudsonKit
        product: HudsonShell
      - package: HudsonKit
        product: HudsonAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hudsonkit.demoios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
