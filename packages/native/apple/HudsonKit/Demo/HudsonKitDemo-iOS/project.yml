name: HudsonKitDemoIOS
options:
  bundleIdPrefix: com.hudsonkit
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true

packages:
  HudsonKit:
    path: ../..
  Termini:
    path: /Users/arach/dev/Termini

targets:
  HudsonKitDemoIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    preBuildScripts:
      - name: HudLint (drift guard)
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/hudlint.stamp
        script: |
          set -euo pipefail
          KIT_ROOT="${SRCROOT}/../.."
          TOOL_DIR="${KIT_ROOT}/Tools/HudLint"
          BIN="${TOOL_DIR}/.build/release/hudlint"
          # Build the linter once per machine; cached afterwards.
          if [ ! -x "${BIN}" ]; then
            (cd "${TOOL_DIR}" && /usr/bin/env xcrun swift build -c release --product hudlint)
          fi
          # Lint kit Sources + this demo's Sources. Xcode-parseable output.
          "${BIN}" --root "${KIT_ROOT}/Sources" --root "${SRCROOT}/Sources" --format xcode
          /usr/bin/touch "${DERIVED_FILE_DIR}/hudlint.stamp"
    dependencies:
      - package: HudsonKit
        product: HudsonObservability
      - package: HudsonKit
        product: HudsonUI
      - package: HudsonKit
        product: HudsonShell
      - package: HudsonKit
        product: HudsonAI
      - package: HudsonKit
        product: HudsonVoice  # requires HUDSONKIT_WITH_VOICE=1 in build env
      - package: Termini
        product: Termini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hudsonkit.demoios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Demo for HudPermissionGate microphone request."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Demo for HudPermissionGate speech-recognition request."
        INFOPLIST_KEY_NSCameraUsageDescription: "Demo for HudPermissionGate camera request."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Demo for HudPermissionGate photos request."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HUDSON_VOICE"
